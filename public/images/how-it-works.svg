<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-label="How OpenRelief works — five step flow">
  <defs>
    <linearGradient id="stepBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="460" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="24" font-weight="800" fill="#0f172a">How It Works</text>
  <text x="550" y="64" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#64748b">From emergency to coordinated response in seconds</text>

  <!-- Step 1 -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="180" height="200" rx="14" fill="url(#stepBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="#ef4444"/>
    <text x="90" y="58" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="26" fill="#fff" font-weight="700">1</text>
    <text x="90" y="108" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Report</text>
    <text x="90" y="134" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">A victim taps</text>
    <text x="90" y="150" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">"Report" with</text>
    <text x="90" y="166" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">type + location</text>
    <text x="90" y="186" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#22c55e">works offline ✓</text>
  </g>
  <line x1="224" y1="210" x2="256" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#flow)"/>

  <!-- Step 2 -->
  <g transform="translate(260,110)">
    <rect x="0" y="0" width="180" height="200" rx="14" fill="url(#stepBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="#f97316"/>
    <text x="90" y="58" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="26" fill="#fff" font-weight="700">2</text>
    <text x="90" y="108" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Validate</text>
    <text x="90" y="134" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">Edge checks rate</text>
    <text x="90" y="150" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">limits + trust</text>
    <text x="90" y="166" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">score of reporter</text>
    <text x="90" y="186" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#3b82f6">Sybil-resistant</text>
  </g>
  <line x1="444" y1="210" x2="476" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#flow)"/>

  <!-- Step 3 -->
  <g transform="translate(480,110)">
    <rect x="0" y="0" width="180" height="200" rx="14" fill="url(#stepBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="#10b981"/>
    <text x="90" y="58" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="26" fill="#fff" font-weight="700">3</text>
    <text x="90" y="108" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Geo-dispatch</text>
    <text x="90" y="134" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">PostGIS finds</text>
    <text x="90" y="150" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">nearby responders</text>
    <text x="90" y="166" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">via spatial index</text>
    <text x="90" y="186" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#a855f7">&lt;100ms latency</text>
  </g>
  <line x1="664" y1="210" x2="696" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#flow)"/>

  <!-- Step 4 -->
  <g transform="translate(700,110)">
    <rect x="0" y="0" width="180" height="200" rx="14" fill="url(#stepBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="#3b82f6"/>
    <text x="90" y="58" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="26" fill="#fff" font-weight="700">4</text>
    <text x="90" y="108" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Consensus</text>
    <text x="90" y="134" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">Multiple reports</text>
    <text x="90" y="150" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">cross-confirm the</text>
    <text x="90" y="166" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">same incident</text>
    <text x="90" y="186" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#f97316">cuts false alarms</text>
  </g>
  <line x1="884" y1="210" x2="916" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#flow)"/>

  <!-- Step 5 -->
  <g transform="translate(920,110)">
    <rect x="0" y="0" width="140" height="200" rx="14" fill="url(#stepBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="70" cy="50" r="28" fill="#a855f7"/>
    <text x="70" y="58" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="26" fill="#fff" font-weight="700">5</text>
    <text x="70" y="108" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Respond</text>
    <text x="70" y="134" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">Push notifies</text>
    <text x="70" y="150" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">responders &amp;</text>
    <text x="70" y="166" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#94a3b8">live map updates</text>
    <text x="70" y="186" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#22c55e">realtime ✓</text>
  </g>

  <!-- Bottom bar -->
  <rect x="40" y="340" width="1020" height="70" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="550" y="368" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">Built for unreliable networks</text>
  <text x="550" y="390" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#7f1d1d">Reports queue in the Service Worker and sync automatically when connectivity returns</text>
</svg>
