<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="OpenRelief — Offline-first emergency coordination platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="3" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#64748b" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400"/>
  </g>

  <!-- Glow behind logo -->
  <circle cx="210" cy="200" r="170" fill="url(#glow)"/>

  <!-- Logo mark: shield with pulse + location pin -->
  <g transform="translate(130,110)" filter="url(#ds)">
    <!-- Shield -->
    <path d="M80 0 L150 28 L150 110 C150 165 120 200 80 220 C40 200 10 165 10 110 L10 28 Z"
          fill="#ffffff" opacity="0.97"/>
    <!-- Inner accent shield -->
    <path d="M80 14 L136 37 L136 108 C136 156 110 186 80 204 C50 186 24 156 24 108 L24 37 Z"
          fill="url(#accent)"/>
    <!-- Location pin -->
    <g transform="translate(80,108)">
      <path d="M0 -44 C-20 -44 -34 -30 -34 -12 C-34 12 0 40 0 40 C0 40 34 12 34 -12 C34 -30 20 -44 0 -44 Z"
            fill="#ffffff"/>
      <circle cx="0" cy="-12" r="13" fill="#ef4444"/>
    </g>
    <!-- Pulse line -->
    <path d="M40 168 L58 168 L66 150 L76 186 L86 156 L96 168 L120 168"
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(400,150)">
    <text x="0" y="0" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Open<tspan fill="#ef4444">Relief</tspan></text>
    <text x="4" y="46" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Offline-first emergency coordination platform</text>
  </g>

  <!-- Feature pills -->
  <g transform="translate(400,232)" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="600">
    <g>
      <rect x="0" y="0" width="150" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <circle cx="20" cy="19" r="5" fill="#22c55e"/>
      <text x="34" y="24" fill="#e2e8f0">Offline-first PWA</text>
    </g>
    <g transform="translate(166,0)">
      <rect x="0" y="0" width="130" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <circle cx="20" cy="19" r="5" fill="#3b82f6"/>
      <text x="34" y="24" fill="#e2e8f0">Live MapLibre</text>
    </g>
    <g transform="translate(312,0)">
      <rect x="0" y="0" width="140" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <circle cx="20" cy="19" r="5" fill="#a855f7"/>
      <text x="34" y="24" fill="#e2e8f0">Trust &amp; Consensus</text>
    </g>
    <g transform="translate(472,0)">
      <rect x="0" y="0" width="120" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <circle cx="20" cy="19" r="5" fill="#f97316"/>
      <text x="34" y="24" fill="#e2e8f0">PostGIS Spatial</text>
    </g>
  </g>

  <!-- Tech stack badges (bottom) -->
  <g transform="translate(400,300)" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#64748b">
    <text x="0" y="0">Next.js 15</text>
    <text x="92" y="0">·</text>
    <text x="106" y="0">React 18</text>
    <text x="184" y="0">·</text>
    <text x="198" y="0">TypeScript</text>
    <text x="290" y="0">·</text>
    <text x="304" y="0">Supabase</text>
    <text x="384" y="0">·</text>
    <text x="398" y="0">Cloudflare Workers</text>
    <text x="540" y="0">·</text>
    <text x="554" y="0">MapLibre GL</text>
  </g>

  <!-- Right-side map radar decoration -->
  <g transform="translate(1010,200)" opacity="0.55">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#334155" stroke-width="1"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#334155" stroke-width="1"/>
    <!-- Sweep -->
    <path d="M0 0 L120 0 A120 120 0 0 0 86 -86 Z" fill="url(#accent)" opacity="0.18"/>
    <!-- Alert dots -->
    <circle cx="48" cy="-30" r="6" fill="#ef4444"/>
    <circle cx="48" cy="-30" r="12" fill="#ef4444" opacity="0.3"/>
    <circle cx="-60" cy="40" r="5" fill="#f97316"/>
    <circle cx="70" cy="60" r="5" fill="#22c55e"/>
  </g>
</svg>
